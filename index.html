
<!DOCTYPE html>
<html lang="ms" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VectorGuard AI - Bio-Defense System</title>
    <meta name="description" content="Aplikasi analisis kawalan vektor serangga (lalat & nyamuk) menggunakan AI untuk mengenalo pasti tempat pembiakan dan strategi kawalan." />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VectorGuard" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1616/1616487.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617; /* Slate 950 */
        color: #e2e8f0;
        overflow-x: hidden;
        overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile app feel */
      }
      
      h1, h2, h3, h4, h5, .font-sci-fi {
        font-family: 'Orbitron', sans-serif;
      }

      .font-mono-sci {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Custom scrollbar for Dark Mode */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
        border: 1px solid #1e293b;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
        box-shadow: 0 0 10px #10b981;
      }

      /* ======================================================================
         MOD KLINIKAL CERAH (KKM INSTITUTIONAL LIGHT MODE)
         Diaktifkan apabila html mempunyai kelas .light-clinical
         ====================================================================== */
      html.light-clinical body {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
      }
      html.light-clinical ::-webkit-scrollbar-track {
        background: #e2e8f0;
      }
      html.light-clinical ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border: 1px solid #cbd5e1;
      }
      html.light-clinical .bg-slate-950,
      html.light-clinical .bg-slate-950\/95,
      html.light-clinical .bg-slate-950\/90,
      html.light-clinical .bg-slate-950\/80,
      html.light-clinical .bg-slate-950\/60,
      html.light-clinical .bg-slate-950\/50 {
        background-color: rgba(255, 255, 255, 0.96) !important;
      }
      html.light-clinical .bg-slate-900,
      html.light-clinical .bg-slate-900\/95,
      html.light-clinical .bg-slate-900\/90,
      html.light-clinical .bg-slate-900\/80,
      html.light-clinical .bg-slate-900\/70,
      html.light-clinical .bg-slate-900\/60,
      html.light-clinical .bg-slate-900\/50,
      html.light-clinical .bg-slate-900\/40 {
        background-color: #ffffff !important;
        box-shadow: 0 4px 16px -4px rgba(15, 23, 42, 0.06) !important;
      }
      html.light-clinical .bg-slate-800,
      html.light-clinical .bg-slate-800\/90,
      html.light-clinical .bg-slate-800\/80,
      html.light-clinical .bg-slate-800\/60 {
        background-color: #f1f5f9 !important;
      }
      html.light-clinical .border-slate-800,
      html.light-clinical .border-slate-800\/80,
      html.light-clinical .border-slate-700,
      html.light-clinical .border-slate-700\/50,
      html.light-clinical .border-slate-600 {
        border-color: #cbd5e1 !important;
      }
      html.light-clinical .text-white,
      html.light-clinical .text-slate-100,
      html.light-clinical .text-slate-200 {
        color: #0f172a !important;
      }
      html.light-clinical .text-slate-300 {
        color: #334155 !important;
      }
      html.light-clinical .text-slate-400,
      html.light-clinical .text-slate-500 {
        color: #475569 !important;
      }
      html.light-clinical .text-emerald-400,
      html.light-clinical .text-emerald-300 {
        color: #047857 !important;
      }
      html.light-clinical .text-cyan-400,
      html.light-clinical .text-cyan-300 {
        color: #0369a1 !important;
      }
      html.light-clinical .bg-emerald-950\/80,
      html.light-clinical .bg-emerald-950\/60,
      html.light-clinical .bg-emerald-950\/40,
      html.light-clinical .bg-emerald-950\/30 {
        background-color: #ecfdf5 !important;
      }
      html.light-clinical .bg-cyan-950\/80,
      html.light-clinical .bg-cyan-950\/60,
      html.light-clinical .bg-cyan-950\/40,
      html.light-clinical .bg-cyan-950\/30 {
        background-color: #f0f9ff !important;
      }
      /* Preserve white text on solid accent buttons in Clinical Light Mode */
      html.light-clinical .bg-emerald-600,
      html.light-clinical .bg-emerald-500,
      html.light-clinical .bg-cyan-600,
      html.light-clinical .bg-cyan-500,
      html.light-clinical .bg-blue-600,
      html.light-clinical .bg-red-600,
      html.light-clinical .bg-amber-600 {
        color: #ffffff !important;
      }
      html.light-clinical .bg-emerald-600 span,
      html.light-clinical .bg-cyan-600 span,
      html.light-clinical .bg-blue-600 span,
      html.light-clinical .bg-red-600 span {
        color: #ffffff !important;
      }

      /* Animations */
      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(30px, -50px) rotate(10deg); }
        66% { transform: translate(-20px, 20px) rotate(-5deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        50% { opacity: 0.8; box-shadow: 0 0 40px rgba(16, 185, 129, 0.6); }
      }

      @keyframes scan-line {
        0% { top: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      /* 
         STRATEGI PRINT V5 (A4 PDF PERFECTION):
         Kita buang margin browser (@page { margin: 0 }) supaya kita boleh kawal
         padding dalaman dengan tepat menggunakan CSS (20mm padding).
         Ini menjadikan PDF nampak macam dokumen Word yang kemas.
      */
      
      #print-mount {
        display: none;
      }

      body.is-printing {
        background-color: #525659 !important; /* PDF Viewer Background look */
        overflow: visible !important;
        height: auto !important;
      }

      body.is-printing #root {
        display: none !important;
      }

      body.is-printing #print-mount {
        display: block !important;
        position: relative;
        width: 100%;
        min-height: 100vh;
        z-index: 99999;
      }

      @media print {
        @page { 
          margin: 0; /* PENTING: Buang margin browser */
          size: A4 portrait; 
        }

        html, body {
          width: 210mm;
          height: 100%;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
          color: black !important;
        }

        #root, .no-print {
          display: none !important;
        }
        
        #print-mount {
          display: block !important;
          width: 100% !important;
        }

        /* Kelas untuk elak page break di tengah-tengah komponen */
        .avoid-break {
          break-inside: avoid;
          page-break-inside: avoid;
        }

        .print-page-break-after {
          break-after: page;
          page-break-after: always;
        }

        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div id="print-mount"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
