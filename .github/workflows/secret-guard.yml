name: "GitHub API Key & Secret Guard"

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: "Audit Kebocoran API Key & Fail Sensitif"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Semak Fail Terlarang (.env / Kunci Peribadi / Kredensial)
        run: |
          echo "🔍 Memeriksa sama ada fail rahsia termasuk di dalam Git..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '(^|/)\.env($|\.)|service-account.*\.json$|client_secret.*\.json$|\.pem$|\.key$|\.p12$|\.pfx$|\.npmrc$|\.netrc$' | grep -v '\.env\.example$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "❌ BAHAYA: Fail sensitif ditemui di dalam repositori Git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "✅ Tiada fail .env atau fail kunci sensitif dikesan."

      - name: Imbas Corak API Key Sebenar Dalam Kod Sumber
        run: |
          echo "🔍 Mengimbas corak kunci API (Gemini, Telegram, GitHub, Private Key)..."
          LEAKS=$(git grep -I -n -E 'AIza[0-9A-Za-z_-]{35}|[0-9]{8,10}:[A-Za-z0-9_-]{35}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . ':!.github/workflows/secret-guard.yml' || true)
          if [ -n "$LEAKS" ]; then
            echo "❌ BAHAYA: Corak API Key atau Private Key sebenar dikesan di dalam kod!"
            echo "$LEAKS"
            exit 1
          fi
          echo "✅ Kod sumber bersih daripada kebocoran API Key."
